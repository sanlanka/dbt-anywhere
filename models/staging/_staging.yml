version: 2

models:
  - name: stg_customers
    description: One row per customer, lightly cleaned.
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: stg_orders
    description: One row per order, lightly cleaned.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: status
        tests:
          - accepted_values:
              values: [completed, returned, pending]
