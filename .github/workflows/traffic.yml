name: Traffic stats

on:
  schedule:
    - cron: "17 3 * * *"   # daily at 03:17 UTC
  workflow_dispatch:         # run on demand from the Actions tab

permissions:
  contents: write            # push to the stats branch (NOT main)

concurrency:
  group: traffic-stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      BRANCH: traffic-stats  # data lives here; main is never touched
    steps:
      - uses: actions/checkout@v4   # brings in .github/scripts/traffic.py

      # Short-lived (1h) token scoped to Administration:read — reads traffic only.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: "4387378"   # App ID is not secret; only the private key is
          private-key: ${{ secrets.PAGE_VIEWER_COUNTER_GITHUB_ACCESS_KEY }}
          permission-administration: read

      - name: Snapshot traffic onto the ${{ env.BRANCH }} branch
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}   # traffic API (admin:read)
          PUSH_TOKEN: ${{ github.token }}                   # push to the stats branch
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          TMP="$(mktemp -d)"

          # Check out the stats branch (holds prior history) — or start it empty.
          if git ls-remote --exit-code --heads "$REMOTE" "$BRANCH" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$BRANCH" "$REMOTE" "$TMP"
          else
            git clone --depth 1 "$REMOTE" "$TMP"
            git -C "$TMP" checkout --orphan "$BRANCH"
            git -C "$TMP" reset --hard
            git -C "$TMP" clean -fdx
          fi

          # Merge today's numbers into that branch's stats/ dir.
          STATS_DIR="$TMP/stats" python3 .github/scripts/traffic.py

          git -C "$TMP" add stats
          if git -C "$TMP" diff --cached --quiet; then
            echo "No changes."
          else
            git -C "$TMP" commit -m "chore: update traffic stats [skip ci]"
            git -C "$TMP" push "$REMOTE" "HEAD:$BRANCH"
          fi
