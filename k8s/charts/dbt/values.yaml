# Values for the dbt chart.
#
# This chart deploys dbt only. It does NOT run a warehouse — it connects to the
# one you already have. Credentials come from a Kubernetes Secret that
# spinup.sh builds from your .env file, so nothing sensitive lands in here.

warehouse:
  # Secret holding the DBT_* connection vars. spinup.sh creates it from .env.
  secretName: dbt-warehouse
  # BigQuery only: a Secret holding the service-account JSON, mounted at
  # mountPath. Create it yourself, then set the name here:
  #   kubectl create secret generic dbt-bigquery-key -n data \
  #     --from-file=bigquery.json=/path/to/key.json
  keyfileSecret: ""
  keyfileMountPath: /secrets

dbt:
  # Built by Skaffold from docker/dbt/Dockerfile. Skaffold overrides this at
  # deploy time; the default lets `helm template` work standalone.
  image: dbt-runner:latest
  # Run seed/run/test on startup before serving docs. Set false to get an idle
  # pod you can `kubectl exec` into.
  buildOnStart: true
  docsPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# Mount the project (models/, seeds/, dbt_project.yml, ...) into the dbt pod so
# edits on your Mac are picked up by the next `dbt run` — no image rebuild.
# Docker Desktop / minikube share /Users. spinup.sh injects hostPath = repo dir.
hostMount:
  enabled: true
  hostPath: ""              # repo dir; set by Skaffold/spinup.sh
  mountPath: /dbt           # where the project lands inside the pod
