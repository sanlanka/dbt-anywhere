# Only needed if you don't already have Postgres on :5432.
# Credentials match the defaults in profiles.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: dbt-local-postgres
    environment:
      POSTGRES_USER: dbt
      POSTGRES_PASSWORD: dbt
      POSTGRES_DB: dbt_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt -d dbt_local"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
