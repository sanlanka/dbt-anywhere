apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbt-runner
  labels:
    app: dbt-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dbt-runner
  template:
    metadata:
      labels:
        app: dbt-runner
    spec:
      containers:
        - name: dbt-runner
          image: {{ .Values.dbt.image | quote }}
          env:
{{ include "dbt.pgEnv" . | indent 12 }}
            - name: DBT_TARGET
              value: postgres
            - name: DBT_PROFILES_DIR
              value: {{ .Values.hostMount.mountPath | quote }}
            # Keep target/ and logs/ out of the mounted repo — the pod runs as
            # a different uid than you, and root-owned build output in a git
            # working tree is a nuisance.
            - name: DBT_TARGET_PATH
              value: /tmp/target
            - name: DBT_LOG_PATH
              value: /tmp/logs
            - name: DBT_BUILD_ON_START
              value: {{ .Values.dbt.buildOnStart | quote }}
            - name: DBT_DOCS_PORT
              value: {{ .Values.dbt.docsPort | quote }}
          ports:
            - name: docs
              containerPort: {{ .Values.dbt.docsPort }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.dbt.docsPort }}
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          workingDir: {{ .Values.hostMount.mountPath | quote }}
          volumeMounts:
{{ include "dbt.projectMount" . | indent 12 }}
          resources:
{{ toYaml .Values.dbt.resources | indent 12 }}
      volumes:
{{ include "dbt.projectVolume" . | indent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: dbt-docs
  labels:
    app: dbt-runner
spec:
  selector:
    app: dbt-runner
  ports:
    - name: docs
      port: {{ .Values.dbt.docsPort }}
      targetPort: {{ .Values.dbt.docsPort }}
